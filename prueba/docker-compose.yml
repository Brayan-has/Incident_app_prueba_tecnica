services:
  # app:
  #   build: .
  #   container_name: incidents_app
  #   ports:
  #     - "8000:8000"
  #   volumes:
  #     - .:/var/www
  #   depends_on:
  #     - mysql
  #     - redis

  mysql:
    image: mysql:8.0
    container_name: mysql_server
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: admin
      MYSQL_DATABASE: incident_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  redis:
    image: redis:7.2
    container_name: redis_server
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mysql_data:
  redis_data:
